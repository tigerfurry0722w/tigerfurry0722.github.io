<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服務台離站提醒</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 border-t-4 border-amber-500">
        
        <!-- Header with Warning Icon -->
        <div class="text-center mb-6">
            <div class="flex justify-center mb-4">
                <div class="bg-amber-100 p-3 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
            </div>
            <h1 class="text-xl font-bold text-gray-800">您即將離開服務台</h1>
            <p class="text-red-600 font-bold mt-3 text-sm">
                請勿在不知情的情況下填寫機密資訊 (如：個人資料、信用卡資訊)。
            </p>
        </div>

        <div class="mb-6">
            <a href="https://forms.gle/rKpUfJg7L1UMqQw8A" 
               class="block w-full bg-green-600 text-white text-center font-bold py-4 rounded-xl hover:bg-green-700 transition shadow-lg text-lg">
                一鍵前往目標網址
            </a>
        </div>

        <div class="border-t pt-4 text-[12px] text-gray-500 text-center space-y-2">
            <p>💡 遇到疑問？</p>
            <p>請撥打 <a href="tel:165" class="text-blue-600 underline font-bold">165 反詐騙專線</a></p>
            <p>或參考 <a href="https://165.npa.gov.tw/" target="_blank" class="text-blue-600 underline">內政部警政署 165 全民防騙網</a></p>
            <p>需要協助嗎？請<a href="https://forms.gle/Zq3ZYcVPqH1noW8g6" class="text-blue-600 underline font-bold">前往服務台</a></p>
        </div>
    </div>

</body>
</html>
